{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h3>Students</h3>
    <a href="{{ url_for('add') }}" class="btn btn-primary">+ Add Student</a>
</div>
<table class="table table-striped table-bordered bg-white">
    <thead class="table-dark"><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr></thead>
    <tbody>
    {% for s in students %}
        <tr>
            <td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.course }}</td>
            <td>
                <a href="{{ url_for('edit', id=s.id) }}" class="btn btn-sm btn-warning">Edit</a>
                <form method="POST" action="{{ url_for('delete', id=s.id) }}" class="d-inline"
                      onsubmit="return confirm('Delete this student?');">
                    <button class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
    {% else %}
        <tr><td colspan="5" class="text-center">No students yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
