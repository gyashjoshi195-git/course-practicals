<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Student Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-3">
    <a class="navbar-brand" href="{% url 'student_list' %}">Student Manager</a>
    <div>
        {% if user.is_authenticated %}
            <span class="text-white me-2">Hi, {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}<button class="btn btn-sm btn-outline-light">Logout</button>
            </form>
        {% else %}
            <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a>
            <a class="btn btn-sm btn-primary" href="{% url 'signup' %}">Sign up</a>
        {% endif %}
    </div>
</nav>
<div class="container py-4">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
