{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h3>Students</h3>
    <a class="btn btn-primary" href="{% url 'student_create' %}">+ Add Student</a>
</div>
<table class="table table-striped table-bordered bg-white">
    <thead class="table-dark"><tr><th>Name</th><th>Email</th><th>Course</th><th>Marks</th><th>Actions</th></tr></thead>
    <tbody>
    {% for s in students %}
        <tr>
            <td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.get_course_display }}</td><td>{{ s.marks }}</td>
            <td>
                <a class="btn btn-sm btn-warning" href="{% url 'student_update' s.pk %}">Edit</a>
                <a class="btn btn-sm btn-danger" href="{% url 'student_delete' s.pk %}">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="5" class="text-center">No students yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
