{% extends "base.html" %}
{% block content %}
<h3>{{ 'Edit' if student else 'Add' }} Student</h3>
<form method="POST">
    <div class="mb-3"><label class="form-label">Name</label>
        <input name="name" class="form-control" required value="{{ student.name if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required value="{{ student.email if student else '' }}"></div>
    <div class="mb-3"><label class="form-label">Course</label>
        <input name="course" class="form-control" required value="{{ student.course if student else '' }}"></div>
    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
